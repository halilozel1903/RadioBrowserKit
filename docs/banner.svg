<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16121f"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff6b54" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6b54" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1b28"/>
      <stop offset="1" stop-color="#14131c"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#d9364f"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#3a3fbf"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fd0a4"/><stop offset="1" stop-color="#1b7a6b"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c453"/><stop offset="1" stop-color="#c47a1c"/></linearGradient>
    <linearGradient id="t5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c77dff"/><stop offset="1" stop-color="#6a2fb8"/></linearGradient>
    <linearGradient id="t6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7eb6"/><stop offset="1" stop-color="#b8326e"/></linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Radio waves -->
  <g fill="none" stroke="#ff6b54" stroke-linecap="round" opacity="0.5">
    <path d="M1180 95 a60 60 0 0 1 0 84" stroke-width="6"/>
    <path d="M1205 70 a95 95 0 0 1 0 134" stroke-width="6" opacity="0.6"/>
    <path d="M1230 45 a130 130 0 0 1 0 184" stroke-width="6" opacity="0.35"/>
  </g>

  <!-- Title -->
  <g font-family="SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif">
    <g transform="translate(80 150)">
      <circle cx="26" cy="26" r="26" fill="#ff6b54"/>
      <circle cx="26" cy="26" r="7" fill="#16121f"/>
      <path d="M10 10 a22 22 0 0 0 0 32 M42 10 a22 22 0 0 1 0 32" fill="none" stroke="#16121f" stroke-width="4" stroke-linecap="round"/>
      <text x="70" y="40" font-size="26" font-weight="600" fill="#ff9a86" letter-spacing="4">SWIFT PACKAGE</text>
    </g>
    <text x="80" y="268" font-size="62" font-weight="800" fill="#ffffff">RadioBrowserKit</text>
    <text x="80" y="322" font-size="24" fill="#c9c6d6">Internet radio from the Radio Browser</text>
    <text x="80" y="356" font-size="24" fill="#c9c6d6">community database, on Mac and Apple TV.</text>

    <!-- Chips -->
    <g font-size="20" font-weight="600" fill="#ffffff">
      <rect x="80" y="400" width="150" height="44" rx="22" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="155" y="429" text-anchor="middle">Mirrors</text>
      <rect x="244" y="400" width="130" height="44" rx="22" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="309" y="429" text-anchor="middle">Search</text>
      <rect x="388" y="400" width="210" height="44" rx="22" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="493" y="429" text-anchor="middle">Countries · Tags</text>
      <rect x="80" y="458" width="170" height="44" rx="22" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="165" y="487" text-anchor="middle">Top stations</text>
      <rect x="264" y="458" width="200" height="44" rx="22" fill="#ff6b54" fill-opacity="0.22" stroke="#ff6b54" stroke-opacity="0.6"/>
      <text x="364" y="487" text-anchor="middle">HLS + ICY player</text>
      <rect x="478" y="458" width="100" height="44" rx="22" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="528" y="487" text-anchor="middle">tvOS</text>
    </g>
    <text x="80" y="560" font-size="19" fill="#8a8799">macOS 14 · tvOS 17 · iOS 17 · Swift 6.2 · MIT</text>
  </g>

  <!-- Mac window illustration -->
  <g transform="translate(680 120)">
    <rect x="0" y="0" width="520" height="350" rx="18" fill="url(#screen)" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="22" r="6" fill="#febc2e"/>
    <circle cx="64" cy="22" r="6" fill="#28c840"/>
    <!-- sidebar -->
    <rect x="12" y="42" width="120" height="244" rx="10" fill="#ffffff" fill-opacity="0.05"/>
    <g fill="#ffffff">
      <rect x="26" y="60" width="74" height="9" rx="4.5" fill-opacity="0.55"/>
      <rect x="26" y="82" width="60" height="9" rx="4.5" fill-opacity="0.3"/>
      <rect x="26" y="104" width="84" height="9" rx="4.5" fill-opacity="0.3"/>
      <rect x="26" y="138" width="50" height="7" rx="3.5" fill-opacity="0.2"/>
      <rect x="26" y="156" width="80" height="9" rx="4.5" fill-opacity="0.3"/>
      <rect x="26" y="178" width="70" height="9" rx="4.5" fill-opacity="0.3"/>
      <rect x="26" y="200" width="88" height="9" rx="4.5" fill-opacity="0.3"/>
      <rect x="26" y="234" width="44" height="7" rx="3.5" fill-opacity="0.2"/>
      <rect x="26" y="252" width="64" height="9" rx="4.5" fill-opacity="0.3"/>
    </g>
    <!-- station grid -->
    <g>
      <rect x="150" y="50" width="104" height="104" rx="14" fill="url(#t1)"/>
      <rect x="268" y="50" width="104" height="104" rx="14" fill="url(#t2)"/>
      <rect x="386" y="50" width="104" height="104" rx="14" fill="#f2f2f5"/>
      <rect x="150" y="184" width="104" height="70" rx="14" fill="url(#t3)"/>
      <rect x="268" y="184" width="104" height="70" rx="14" fill="#f2f2f5"/>
      <rect x="386" y="184" width="104" height="70" rx="14" fill="url(#t5)"/>
      <!-- abstract logos -->
      <circle cx="438" cy="102" r="28" fill="none" stroke="#d9364f" stroke-width="10"/>
      <path d="M296 230 l20 -26 l20 26 l20 -26" fill="none" stroke="#3a3fbf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#ffffff" fill-opacity="0.9">
        <rect x="180" y="96" width="44" height="12" rx="6"/>
        <rect x="298" y="96" width="44" height="12" rx="6"/>
        <rect x="180" y="214" width="44" height="12" rx="6"/>
        <rect x="416" y="214" width="44" height="12" rx="6"/>
      </g>
      <g fill="#ffffff" fill-opacity="0.35">
        <rect x="150" y="162" width="80" height="7" rx="3.5"/>
        <rect x="268" y="162" width="70" height="7" rx="3.5"/>
        <rect x="386" y="162" width="86" height="7" rx="3.5"/>
      </g>
    </g>
    <!-- now playing bar -->
    <rect x="12" y="296" width="496" height="42" rx="10" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="22" y="303" width="28" height="28" rx="6" fill="url(#t4)"/>
    <rect x="60" y="308" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="60" y="321" width="64" height="6" rx="3" fill="#ffffff" fill-opacity="0.3"/>
    <g transform="translate(166 317)">
      <rect x="0" y="-8" width="4" height="16" rx="2" fill="#ff6b54"/>
      <rect x="8" y="-12" width="4" height="24" rx="2" fill="#ff6b54"/>
      <rect x="16" y="-6" width="4" height="12" rx="2" fill="#ff6b54"/>
      <rect x="24" y="-10" width="4" height="20" rx="2" fill="#ff6b54"/>
    </g>
    <circle cx="218" cy="317" r="15" fill="#ff6b54"/>
    <path d="M213 309 l12 8 l-12 8 z" fill="#ffffff"/>
  </g>

  <!-- Apple TV illustration -->
  <g transform="translate(930 444)">
    <rect x="0" y="0" width="330" height="190" rx="14" fill="#0f0e15" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="12" y="12" width="306" height="166" rx="8" fill="url(#screen)"/>
    <rect x="30" y="30" width="110" height="110" rx="12" fill="url(#t6)"/>
    <circle cx="85" cy="85" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="7"/>
    <circle cx="85" cy="85" r="7" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="158" y="40" width="70" height="8" rx="4" fill="#ff6b54"/>
    <rect x="158" y="60" width="130" height="14" rx="7" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="158" y="84" width="100" height="8" rx="4" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="158" y="112" width="80" height="26" rx="13" fill="#ffffff"/>
    <path d="M190 118 l12 7 l-12 7 z" fill="#0f0e15"/>
    <g fill="#ffffff" fill-opacity="0.18">
      <rect x="30" y="152" width="40" height="18" rx="4"/>
      <rect x="78" y="152" width="40" height="18" rx="4"/>
      <rect x="126" y="152" width="40" height="18" rx="4"/>
      <rect x="174" y="152" width="40" height="18" rx="4"/>
      <rect x="222" y="152" width="40" height="18" rx="4"/>
    </g>
  </g>
</svg>
