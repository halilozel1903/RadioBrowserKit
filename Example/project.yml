name: RadioBrowserDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    macOS: "14.0"
    tvOS: "17.0"
packages:
  RadioBrowserKit:
    path: ..
targets:
  WavelengthMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac
    dependencies:
      - package: RadioBrowserKit
        product: RadioBrowserKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.WavelengthMac
        PRODUCT_NAME: WavelengthMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Mac-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Wavelength
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Halil Özel"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
  WavelengthTV:
    type: application
    platform: tvOS
    sources:
      - Shared
      - TV
    dependencies:
      - package: RadioBrowserKit
        product: RadioBrowserKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.WavelengthTV
        PRODUCT_NAME: WavelengthTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/TV-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Wavelength
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # No asset catalog: a tvOS icon needs a layered App Icon & Top Shelf brand assets set,
        # which a demo does not need, so the app builds without an icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "3"
schemes:
  WavelengthMac:
    build:
      targets:
        WavelengthMac: all
    run:
      config: Debug
  WavelengthTV:
    build:
      targets:
        WavelengthTV: all
    run:
      config: Debug
